<main class="page">
  <app-header
    [fullName]="fullName"
    [role]="role"
    [location]="location"
    [email]="email"
    [phone]="phone"
    [profile]="profile"
    [checkpoint]="checkpoint" />

  <app-profile-card />

  <app-skills
    [skills]="skills"
    [checkpoint]="checkpoint"
    (skillSelected)="onSkillSelected($event)" />

  <section class="interaction" aria-live="polite">
    <h2 class="section-title">Angular Interaction</h2>
    <p class="message">{{ message }}</p>
  </section>

  <app-footer
    [fullName]="fullName"
    [proficiencies]="proficiencies"
    [checkpoint]="checkpoint" />
</main>
